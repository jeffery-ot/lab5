Comment: State machine with Glue jobs, parallel crawlers, and Athena queries
StartAt: data ingestion job
States:
  data ingestion job:
    Type: Task
    Resource: arn:aws:states:::glue:startJobRun.sync
    Parameters:
      JobName: data_ingestion
    Next: data transformation job
  data transformation job:
    Type: Task
    Resource: arn:aws:states:::glue:startJobRun.sync
    Parameters:
      JobName: data_transformation
    Next: Run Crawlers in Parallel
  Run Crawlers in Parallel:
    Type: Parallel
    Branches:
      - StartAt: native crawler
        States:
          native crawler:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:glue:startCrawler
            Parameters:
              Name: e_commerce_native_crawler
            End: true
      - StartAt: symlink crawler
        States:
          symlink crawler:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:glue:startCrawler
            Parameters:
              Name: e_commerce_symlink_crawler
            End: true
    Next: Wait for Crawlers to Complete
  Wait for Crawlers to Complete:
    Type: Wait
    Seconds: 30
    Next: Run Athena Queries in Parallel
  Run Athena Queries in Parallel:
    Type: Parallel
    Branches:
      - StartAt: Athena Query 1
        States:
          Athena Query 1:
            Type: Task
            Resource: arn:aws:states:::athena:startQueryExecution.sync
            Parameters:
              QueryString: SELECT * FROM "AwsDataCatalog"."e_commerce_db"."users" LIMIT 5;
              WorkGroup: primary
              ResultConfiguration:
                OutputLocation: s3://lab4-athena-queries/results/users/
            End: true
      - StartAt: Athena Query 2
        States:
          Athena Query 2:
            Type: Task
            Resource: arn:aws:states:::athena:startQueryExecution.sync
            Parameters:
              QueryString: SELECT * FROM "e_commerce_db"."order_items" LIMIT 5;
              WorkGroup: primary
              ResultConfiguration:
                OutputLocation: s3://lab4-athena-queries/results/order_items/
            End: true
      - StartAt: Athena Query 3
        States:
          Athena Query 3:
            Type: Task
            Resource: arn:aws:states:::athena:startQueryExecution.sync
            Parameters:
              QueryString: SELECT * FROM "e_commerce_db"."category" LIMIT 5;
              WorkGroup: primary
              ResultConfiguration:
                OutputLocation: s3://lab4-athena-queries/results/category/
            End: true
      - StartAt: Athena Query 4
        States:
          Athena Query 4:
            Type: Task
            Resource: arn:aws:states:::athena:startQueryExecution.sync
            Parameters:
              QueryString: SELECT * FROM "e_commerce_db"."meta_category" LIMIT 10;
              WorkGroup: primary
              ResultConfiguration:
                OutputLocation: s3://lab4-athena-queries/results/meta_category/
            End: true
    End: true
