
services:
  glue_pyspark:
    image: public.ecr.aws/glue/aws-glue-libs:5
    command: ["pyspark"]
    volumes:
      - "${WORKSPACE_LOCATION}:/home/glue_user/workspace/"           # Mount your project workspace
    environment:
      - DISABLE_SSL=true
      - AWS_PROFILE
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION
    ports:
      - "4040:4040"    
      - "18080:18080"  
    tty: true
    stdin_open: true
    deploy:
      restart_policy:
        condition: on-failure
  