services:
  glue_pyspark:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pyspark"]
    volumes:
      - "${WORKSPACE_LOCATION:-.}:/home/glue_user/workspace/"
    environment:
      DISABLE_SSL: "true"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
    ports:
      - "4041:4040"
      - "18081:18080"
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4040 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
