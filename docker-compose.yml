
services:
  glue_pyspark:
    image: public.ecr.aws/glue/aws-glue-libs:5
    command: ["/bin/bash", "-c", "pip install openpyxl && pyspark"]
    volumes:
      - "${WORKSPACE_LOCATION:-.}:/home/glue_user/workspace/"  # Defaults to current dir if WORKSPACE_LOCATION not set
    environment:
      DISABLE_SSL: "true"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
      # Optional: If using local AWS profiles, uncomment below:
      # AWS_PROFILE: "${AWS_PROFILE}"
    ports:
      - "4041:4040"     # Spark UI
      - "18081:18080"   # Spark History Server (optional)
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4040 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
