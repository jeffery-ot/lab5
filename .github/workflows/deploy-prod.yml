name: production_pipeline_deployment

on:
  workflow_run:
    workflows: ["data_pipeline_development"]
    types:
      - completed
    branches:
      - dev
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      update_state_machine:
        description: 'Update state machine if it already exists? (true/false)'
        required: true
        default: 'false'
        type: boolean

env:
  STATE_MACHINE_ARN: "arn:aws:states:us-east-1:648637468459:stateMachine:MyStateMachine-22a18e33"
  ROLE_ARN: "arn:aws:iam::648637468459:role/service-role/StepFunctions-MyStateMachine-22a18e33-role-rvcqj4u7h"
  STATE_MACHINE_NAME: "MyStateMachine-22a18e33"
  YAML_FILE: "MyStateMachine-22a18e33.asl.yaml"
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

jobs:
  deploy-and-run-production:
    name: Deploy State Machine and Run Production Pipeline
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Python dependencies
        run: |
          # Install PyYAML for YAML to JSON conversion
          pip install pyyaml
          echo "Python dependencies installed"

      - name: Check if State Machine exists
        id: check_state_machine
        run: |
          # Check if state machine exists
          if aws stepfunctions describe-state-machine --state-machine-arn "${{ env.STATE_MACHINE_ARN }}" 2>/dev/null; then
            echo "State machine exists"
            echo "exists=true" >> $GITHUB_OUTPUT
            CURRENT_ROLE=$(aws stepfunctions describe-state-machine --state-machine-arn "${{ env.STATE_MACHINE_ARN }}" --query 'roleArn' --output text)
            if [ "$CURRENT_ROLE" = "${{ env.ROLE_ARN }}" ]; then
              echo "correct_role=true" >> $GITHUB_OUTPUT
            else
              echo "correct_role=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "correct_role=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate State Machine YAML
        if: |
          steps.check_state_machine.outputs.exists == 'false' || 
          steps.check_state_machine.outputs.correct_role == 'false' || 
          (steps.check_state_machine.outputs.exists == 'true' && 
           steps.check_state_machine.outputs.correct_role == 'true' && 
           github.event_name == 'workflow_dispatch' && 
           inputs.update_state_machine == 'true')
        run: |
          # Validate that the YAML file exists
          if [ ! -f "${{ env.YAML_FILE }}" ]; then
            echo "::error::State machine YAML file (${{ env.YAML_FILE }}) not found"
            exit 1
          fi
          echo "Using ${{ env.YAML_FILE }} to create state machine JSON..."
          python3 <<EOF
import yaml
import json
import sys
try:
    with open("${{ env.YAML_FILE }}", "r") as f:
        data = yaml.safe_load(f)
    definition = data.get("definition") or data.get("StateMachine") or data
    if not definition:
        print("::error::Invalid YAML: No state machine definition found")
        sys.exit(1)
    with open("state-machine-definition.json", "w") as f:
        json.dump(definition, f, indent=2)
except Exception as e:
    print(f"::error::Failed to parse YAML: {str(e)}")
    sys.exit(1)
EOF

      - name: Create or update State Machine
        if: |
          steps.check_state_machine.outputs.exists == 'false' || 
          steps.check_state_machine.outputs.correct_role == 'false' || 
          (steps.check_state_machine.outputs.exists == 'true' && 
           steps.check_state_machine.outputs.correct_role == 'true' && 
           github.event_name == 'workflow_dispatch' && 
           inputs.update_state_machine == 'true')
        run: |
          # Skip update for automated runs if state machine exists with correct role
          if [ "${{ steps.check_state_machine.outputs.exists }}" = "true" ] && \
             [ "${{ steps.check_state_machine.outputs.correct_role }}" = "true" ] && \
             [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "State machine exists with correct role, skipping update for automated run"
            exit 0
          fi
          # Attempt to create or update state machine with retries
          set +e
          for attempt in {1..3}; do
            echo "Attempt $attempt to create/update state machine..."
            if [ "${{ steps.check_state_machine.outputs.exists }}" = "false" ]; then
              aws stepfunctions create-state-machine \
                --name "${{ env.STATE_MACHINE_NAME }}" \
                --definition file://state-machine-definition.json \
                --role-arn "${{ env.ROLE_ARN }}" \
                --type "STANDARD" && break
            else
              aws stepfunctions update-state-machine \
                --state-machine-arn "${{ env.STATE_MACHINE_ARN }}" \
                --definition file://state-machine-definition.json \
                --role-arn "${{ env.ROLE_ARN }}" && break
            fi
            echo "Attempt $attempt failed, retrying in 5 seconds..."
            sleep 5
          done
          if [ $? -ne 0 ]; then
            echo "::error::Failed to create/update state machine after 3 attempts"
            exit 1
          fi
          set -e

      - name: Verify State Machine deployment
        run: |
          # Verify state machine details
          aws stepfunctions describe-state-machine \
            --state-machine-arn "${{ env.STATE_MACHINE_ARN }}" \
            --query '{Name: name, Status: status, RoleArn: roleArn}' \
            --output json | tee state-machine-details.json
          echo "State machine verification output saved to artifact"
        uses: actions/upload-artifact@v4
        with:
          name: state-machine-details
          path: state-machine-details.json

      - name: Validate docker-compose file
        run: |
          # Validate docker-compose.yml
          if [ ! -f "docker-compose.yml" ]; then
            echo "::error::docker-compose.yml not found"
            exit 1
          fi
          docker compose -f docker-compose.yml config || { echo "::error::Invalid docker-compose.yml"; exit 1; }

      - name: Start Glue PySpark container
        run: |
          # Start glue_pyspark service
          docker compose -f docker-compose.yml up -d glue_pyspark

      - name: Wait for container healthcheck
        run: |
          # Wait for container to become healthy (90 seconds timeout)
          echo "Waiting for container to become healthy..."
          for i in {1..18}; do
            CONTAINER_ID=$(docker compose -f docker-compose.yml ps -q glue_pyspark)
            if [ -z "$CONTAINER_ID" ]; then
              echo "::error::Container glue_pyspark not found"
              exit 1
            fi
            status=$(docker inspect --format='{{json .State.Health.Status}}' "$CONTAINER_ID")
            if [ "$status" = "\"healthy\"" ]; then
              echo "Container is healthy!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 5
          done
          if [ "$status" != "\"healthy\"" ]; then
            echo "::error::Container failed to become healthy"
            exit 1
          fi

      - name: Install openpyxl in container
        run: |
          # Install openpyxl in container
          docker compose exec -T glue_pyspark pip install openpyxl

      - name: Debug AWS identity inside container
        run: |
          # Verify AWS credentials in container
          docker compose exec -T glue_pyspark aws sts get-caller-identity | tee aws-identity.txt
        uses: actions/upload-artifact@v4
        with:
          name: aws-identity
          path: aws-identity.txt

      - name: Trigger State Machine via file_renamer_uploader.py
        id: trigger_state_machine
        run: |
          # Validate file existence
          SCRIPT_PATH="${{ github.workspace }}/glue_jobs/file_renamer_uploader.py"
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::file_renamer_uploader.py not found at $SCRIPT_PATH"
            exit 1
          fi
          # Run script and capture execution ARN (assuming script outputs it)
          echo "Running file_renamer_uploader.py to trigger the state machine..."
          EXECUTION_ARN=$(docker compose exec -T glue_pyspark spark-submit "$SCRIPT_PATH")
          echo "execution_arn=$EXECUTION_ARN" >> $GITHUB_OUTPUT
          if [ -z "$EXECUTION_ARN" ]; then
            echo "::error::No execution ARN returned from file_renamer_uploader.py"
            exit 1
          fi

      - name: Monitor State Machine execution
        run: |
          # Monitor the specific execution triggered
          if [ -n "${{ steps.trigger_state_machine.outputs.execution_arn }}" ]; then
            echo "Monitoring execution: ${{ steps.trigger_state_machine.outputs.execution_arn }}"
            aws stepfunctions describe-execution \
              --execution-arn "${{ steps.trigger_state_machine.outputs.execution_arn }}" \
              --query '{Name: name, Status: status, StartDate: startDate, StopDate: stopDate}' \
              --output json | tee execution-details.json
          else
            echo "Falling back to listing recent executions..."
            aws stepfunctions list-executions \
              --state-machine-arn "${{ env.STATE_MACHINE_ARN }}" \
              --max-items 5 \
              --query 'executions[*].{Name: name, Status: status, StartDate: startDate}' \
              --output table
          fi
        if: ${{ steps.trigger_state_machine.outputs.execution_arn != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: execution-details
          path: execution-details.json

      - name: Stop and clean up containers
        if: always()
        run: |
          # Stop containers without removing volumes to preserve data for debugging
          docker compose -f docker-compose.yml down