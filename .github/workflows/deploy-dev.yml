name: data_pipeline_development

on:
  push:
    branches:
      - dev

jobs:
  test-glue-jobs:
    name: Run Glue Job in Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Create .env file for Docker Compose
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}" >> .env
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION_DEV }}" >> .env
          echo "WORKSPACE_LOCATION=${{ github.workspace }}" >> .env

      - name: Start Glue PySpark container
        run: docker compose -f docker-compose.yml up -d glue_pyspark

      - name: Wait for container healthcheck
        run: |
          echo "Waiting for container to become healthy..."
          for i in {1..10}; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' $(docker ps -qf name=glue_pyspark))
            if [ "$status" = "\"healthy\"" ]; then
              echo "Container is healthy!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 5
          done

      - name: Debug AWS inside container (Optional)
        run: |
          docker compose exec glue_pyspark bash -c "\
            echo 'REGION=$AWS_DEFAULT_REGION' && \
            aws sts get-caller-identity || echo 'AWS CLI not configured inside container' \
          "

      - name: Run Glue job - extraction.py
        run: |
          docker compose exec glue_pyspark \
            spark-submit /home/glue_user/workspace/glue_jobs/extraction.py

      - name: Run Glue job - data.py
        run: |
          docker compose exec glue_pyspark \
            spark-submit /home/glue_user/workspace/glue_jobs/data.py

      - name: Stop and clean up containers
        if: always()
        run: docker compose -f docker-compose.yml down --volumes
